name: Build and Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-devops-app .

      - name: Save Docker image
        run: docker save my-devops-app | gzip > app.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: app.tar.gz
          target: /home/ubuntu

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker stop my-devops-app || true
            docker rm my-devops-app || true
            docker load < /home/ubuntu/app.tar.gz
            docker run -d -p 5000:5000 --name my-devops-app my-devops-app
            echo "Deployed successfully!"
